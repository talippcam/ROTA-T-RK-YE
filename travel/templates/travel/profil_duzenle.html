{% extends "base.html" %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h1>Profili Düzenle</h1>
        <p>Profil fotoğrafını buradan güncelleyebilirsin.</p>

        {% if profil.fotograf %}
        <img src="{{ profil.fotograf.url }}" class="profile-edit-preview" alt="Profil fotoğrafı">
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label>Profil Fotoğrafı</label>
            <input 
                type="file" 
                name="fotograf" 
                class="form-control mb-3" 
                accept="image/*"
                required
            >

            <button type="submit" class="btn btn-primary w-100">
                Güncelle
            </button>
        </form>

        <a href="{% url 'profilim' %}" class="btn btn-outline-primary w-100 mt-3">
            Vazgeç
        </a>
    </div>
</section>

{% endblock %}
