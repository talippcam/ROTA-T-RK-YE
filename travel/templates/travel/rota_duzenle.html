{% extends "base.html" %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h1>Rotayı Düzenle</h1>
        <p>Rota bilgilerini buradan güncelleyebilirsin.</p>

        <form method="post">
            {% csrf_token %}

            <label>Rota Başlığı</label>
            <input 
                type="text" 
                name="baslik" 
                class="form-control mb-3" 
                value="{{ rota.baslik }}"
                required
            >

            <label>Şehir</label>
            <select name="sehir_slug" class="form-control mb-3" required>
                {% for slug, sehir in sehirler.items %}
                <option value="{{ slug }}" {% if rota.sehir_slug == slug %}selected{% endif %}>
                    {{ sehir.isim }}
                </option>
                {% endfor %}
            </select>

            <label>Açıklama</label>
            <textarea 
                name="aciklama" 
                class="form-control mb-3" 
                rows="4"
            >{{ rota.aciklama }}</textarea>

            <button type="submit" class="btn btn-primary w-100">
                Güncelle
            </button>
        </form>

        <a href="{% url 'rotalarim' %}" class="btn btn-outline-primary w-100 mt-3">
            Vazgeç
        </a>
    </div>
</section>

{% endblock %}
