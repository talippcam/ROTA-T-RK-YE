{% extends "base.html" %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h1>Kayıt Ol</h1>
        <p>Rota oluşturmak, yorum yapmak ve favorilerini kaydetmek için hesap oluştur.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary w-100">
                Kayıt Ol
            </button>
        </form>

        <div class="auth-link">
            Zaten hesabın var mı?
            <a href="{% url 'giris_yap' %}">Giriş Yap</a>
        </div>
    </div>
</section>

{% endblock %}
