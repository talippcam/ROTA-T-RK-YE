{% extends "base.html" %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h1>Durağı Düzenle</h1>
        <p>Rota durağını buradan güncelleyebilirsin.</p>

        <form method="post">
            {% csrf_token %}

            <label>Sıra</label>
            <input 
                type="number" 
                name="sira" 
                class="form-control mb-3" 
                value="{{ durak.sira }}" 
                min="1"
            >

            <label>Yer Adı</label>
            <input 
                type="text" 
                name="yer_adi" 
                class="form-control mb-3" 
                value="{{ durak.yer_adi }}"
                required
            >

            <label>Not</label>
            <textarea 
                name="notlar" 
                class="form-control mb-3" 
                rows="4"
            >{{ durak.notlar }}</textarea>

            <button type="submit" class="btn btn-primary w-100">
                Güncelle
            </button>
        </form>

        <a href="{% url 'rota_detay' durak.rota.id %}" class="btn btn-outline-primary w-100 mt-3">
            Vazgeç
        </a>
    </div>
</section>

{% endblock %}
